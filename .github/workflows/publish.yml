name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install fonttools
        run: pip3 install fonttools

      - run: make site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

      - name: Rename PDFs for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp build/reading.pdf        release/problem-solver-reading-en.pdf
          cp build/workbook.pdf       release/problem-solver-workbook-en.pdf
          cp build/facilitator.pdf    release/problem-solver-facilitator-en.pdf
          cp build/ko/reading.pdf     release/problem-solver-reading-ko.pdf
          cp build/ko/workbook.pdf    release/problem-solver-workbook-ko.pdf
          cp build/ko/facilitator.pdf release/problem-solver-facilitator-ko.pdf

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/problem-solver-reading-en.pdf
            release/problem-solver-workbook-en.pdf
            release/problem-solver-facilitator-en.pdf
            release/problem-solver-reading-ko.pdf
            release/problem-solver-workbook-ko.pdf
            release/problem-solver-facilitator-ko.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
